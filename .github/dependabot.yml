version: 2
updates:
  # Crate updates as reviewable PRs rather than the dependency tree drifting
  # on its own.
  #
  # Only *patch* bumps are grouped. Dependabot classifies an update by the
  # literal version segments, so egui 0.37 -> 0.38 reaches it as
  # `semver-minor`, but under cargo a 0.x minor bump is precisely the
  # breaking one, and most of what this crate depends on is still 0.x
  # (egui, eframe, egui_extras, resvg, tiny-skia, image, ureq). Grouping
  # minors would hand us one PR that quietly carries breaking API changes
  # for several crates. Patch releases are the churn worth batching;
  # anything above patch arrives on its own so it can be read, built and
  # reverted by itself.
  #
  # egui, eframe and egui_extras are released in lock-step and must share
  # one version. Dependabot opens each as its own PR, and any one of them
  # fails CI until the others catch up. Take them as one deliberate upgrade
  # in a single commit and close the strays.
  - package-ecosystem: cargo
    directory: "/"
    target-branch: freeknet
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-patch:
        applies-to: version-updates
        update-types:
          - patch

  # Actions are pinned to full commit SHAs (see .github/workflows), so a
  # Dependabot PR is the deliberate, diff-visible way a pin moves: it
  # rewrites the SHA and the trailing version comment together. Grouped
  # into one PR, since reading a batch of pins against their release notes
  # is one job. dtolnay/rust-toolchain is pinned to a master commit that
  # belongs to no tag, so Dependabot cannot move it; it moves by hand with
  # rust-toolchain.toml, which tests/toolchain_pin.rs keeps in step.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: freeknet
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
