name: CI

on:
  push:
    branches: [freeknet]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing in this workflow writes to the
# repository, so the token it runs with can only read it. A job that needs
# more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation helps a developer's next edit, never a fresh
  # runner: it only makes the cache bigger and slower to save and restore.
  CARGO_INCREMENTAL: "0"
  # The features CI builds. The svg_* features download thousands of SVG
  # files from the GitHub API at build time (build.rs), and an
  # unauthenticated runner is rate-limited out of that, so they are left out.
  # svg and system-theme are off by default; building them here keeps the
  # resvg and dark-light paths compiled and tested, and the "default
  # features" clippy step below covers the build without them.
  FEATURES: ondemand,spreadsheet,svg,system-theme

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    # Every job has a timeout, well above its slowest cold-cache run, so a
    # hung test fails in minutes rather than holding a runner for GitHub's
    # default six hours.
    timeout-minutes: 10
    steps:
      # Pinned to full SHAs: a mutable tag in a workflow is a supply-chain
      # risk. Update deliberately, with a diff of the new SHA, not silently
      # on the next run. The versions are in the trailing comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version matches rust-toolchain.toml (tests/toolchain_pin.rs
      # checks), so CI and a local checkout run the same rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The dependency surface does not vary by runner (deny.toml names the
    # targets it resolves for), so one run suffices.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

  check:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}

      # eframe is a regular dependency on Linux (x11 and wayland features);
      # its windowing stack needs these headers to build.
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev pkg-config

      # --all-targets covers the examples and tests too, so nothing that
      # only `cargo run --example` would build can rot silently.
      - name: Clippy
        run: cargo clippy --locked --all-targets --features ${{ env.FEATURES }} -- -D warnings

      - name: Clippy, default features
        run: cargo clippy --locked --all-targets -- -D warnings

      # Not --examples: the stories example's theme_test module flips the
      # global theme from parallel tests and races (see CLAUDE.md, Known
      # gaps). Clippy above still builds every example.
      - name: Test
        run: cargo test --locked --features ${{ env.FEATURES }} --lib --tests

      # The doctests compile one binary per snippet, which is slow on
      # Windows and does not vary by platform, so Linux runs them.
      - name: Doctests
        if: runner.os == 'Linux'
        run: cargo test --locked --features ${{ env.FEATURES }} --doc

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev pkg-config
      - name: Build the docs
        run: cargo doc --locked --no-deps --features ${{ env.FEATURES }}

  # One required check for branch protection, whatever the job list
  # becomes: it fails unless every job above succeeded.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [format, deny, check, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job finished with: $result"
              exit 1
            fi
          done
